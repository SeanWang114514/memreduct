name: Build ARM64 release

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: windows-latest
    steps:
      - name: Checkout Mem Reduct
        uses: actions/checkout@v4
        with:
          path: memreduct

      - name: Checkout matching routine dependency
        uses: actions/checkout@v4
        with:
          repository: henrypp/routine
          ref: master
          path: routine

      - name: Pin compatible routine revision
        shell: pwsh
        run: |
          git -C routine fetch --depth=1 origin 2f7ce6a228dbbaa7295b9635ab971d2768a0ae9b
          git -C routine checkout --detach FETCH_HEAD

      - name: Build ARM64
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $vs) { throw 'Visual Studio ARM64 C++ toolchain was not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvarsall.bat was not found: $vcvars" }
          $envDump = Join-Path $env:RUNNER_TEMP 'arm64-env.txt'
          cmd /c "call `"$vcvars`" amd64_arm64 && set > `"$envDump`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content $envDump | ForEach-Object {
            $parts = $_ -split '=', 2
            if ($parts.Length -eq 2) { Set-Content -Path "env:$($parts[0])" -Value $parts[1] }
          }
          msbuild memreduct\memreduct.sln /m /p:Configuration=Release /p:Platform=ARM64 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package ARM64 portable build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path memreduct\bin -Filter memreduct.exe -Recurse | Where-Object { $_.FullName -match '\\ARM64\\' } | Select-Object -First 1
          if (-not $exe) { throw 'ARM64 memreduct.exe was not produced' }
          if ($exe.Length -le 0) { throw 'ARM64 executable is empty' }
          $dir = Join-Path $env:GITHUB_WORKSPACE 'memreduct-arm64'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item $exe.FullName (Join-Path $dir 'memreduct.exe')
          Copy-Item memreduct\bin\Readme.txt,memreduct\bin\History.txt,memreduct\bin\License.txt,memreduct\bin\memreduct.lng -Destination $dir
          Set-Content -Path (Join-Path $dir 'portable.dat') -Value '#PORTABLE#' -NoNewline
          Compress-Archive -Path $dir -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'memreduct-arm64-close-to-tray.zip') -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: memreduct-arm64-close-to-tray
          path: memreduct-arm64-close-to-tray.zip
