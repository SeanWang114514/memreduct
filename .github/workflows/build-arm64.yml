name: Build ARM64 release

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: windows-latest
    steps:
      - name: Checkout Mem Reduct
        uses: actions/checkout@v4
        with:
          path: memreduct

      - name: Checkout routine dependency
        uses: actions/checkout@v4
        with:
          repository: henrypp/routine
          path: routine

      - name: Build ARM64
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" amd64_arm64
          msbuild memreduct\memreduct.sln /m /p:Configuration=Release /p:Platform=ARM64 /verbosity:minimal

      - name: Package ARM64 portable build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path memreduct\bin -Filter memreduct.exe -Recurse | Where-Object { $_.FullName -match 'ARM64' } | Select-Object -First 1
          if (-not $exe) { throw 'ARM64 memreduct.exe was not produced' }
          if ($exe.Length -le 0) { throw 'ARM64 executable is empty' }
          $dir = Join-Path $env:GITHUB_WORKSPACE 'memreduct-arm64'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item $exe.FullName (Join-Path $dir 'memreduct.exe')
          Copy-Item memreduct\bin\Readme.txt,memreduct\bin\History.txt,memreduct\bin\License.txt,memreduct\bin\memreduct.lng -Destination $dir
          Set-Content -Path (Join-Path $dir 'portable.dat') -Value '#PORTABLE#' -NoNewline
          Compress-Archive -Path $dir -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'memreduct-arm64-close-to-tray.zip') -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: memreduct-arm64-close-to-tray
          path: memreduct-arm64-close-to-tray.zip
